name: Package bug
description: Report a reproducible problem in one library or adapter.
title: "[package] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include security vulnerabilities; use private vulnerability reporting.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@velarscript/msgpack@0.1.1"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: VelarScript and Node.js versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include source, exact commands, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
