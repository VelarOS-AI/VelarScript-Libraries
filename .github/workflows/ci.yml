name: Validate libraries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # A package whose boundary is a browser capability is only really checked in a
  # browser. Both engines run, because the consumers of these packages ship on
  # Chromium and on WebKit.
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

  packed-consumer:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - velar: "0.15.0"
            frozenArtifacts: "true"
          - velar: "latest"
            frozenArtifacts: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Verify packed consumers
        env:
          VELAR_CLI_VERSION: ${{ matrix.velar }}
          VELAR_VERIFY_FROZEN_ARTIFACTS: ${{ matrix.frozenArtifacts }}
        run: npm run pack:check
