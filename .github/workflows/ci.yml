name: Validate libraries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # A package whose boundary is a browser capability is only really checked in a
  # browser. Both engines run, because the consumers of these packages ship on
  # Chromium and on WebKit.
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

  packed-consumer:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - name: Verify packed consumers
        # Each source package and packed suite uses its receipt's compiler.
        # SQL/SQLite and LSP integration use the current root compiler.
        run: npm run pack:check
